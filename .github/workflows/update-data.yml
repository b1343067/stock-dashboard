# 每日自動更新股價資料
# 主要觸發：Vercel Cron（api/cron.ts）每天台灣 06:00～06:59 用 GitHub API 觸發（source=cron）
# 備援：GitHub 自己的 schedule（06:17、07:47；但它很不可靠，11/17、11/18 連續兩天沒觸發）
# 也可以在 Actions 頁面手動觸發
name: 更新股價資料

on:
  # GitHub 的排程在整點（特別是 UTC 0 點附近）負載最高，常被延遲好幾個小時甚至取消，
  # 所以刻意避開整點，並排兩次：第一次成功的話，第二次會在「檢查」步驟直接跳過。
  # 同一個資料日期的 Discord 通知只會送一次（scripts/notify.ts 用 data 分支上的 notify-state.json 判斷）。
  schedule:
    - cron: "17 22 * * *"   # 台灣 06:17（美股收盤後約 1 小時）
    - cron: "47 23 * * *"   # 台灣 07:47：備援，第一次沒跑或有股票抓失敗時補上
  # 手動觸發（Actions → 更新股價資料 → Run workflow）；Vercel Cron 也走這裡，會帶 source=cron
  workflow_dispatch:
    inputs:
      source:
        description: "觸發來源（手動執行保持 manual；cron = 每日排程，今天已更新過就略過）"
        required: false
        default: "manual"
  # 修改觀察清單或資料腳本並推到 main 時，也自動重抓一次
  # （Actions 自己 commit 的 public/data 不在清單內，不會無限循環）
  push:
    branches: [main]
    paths:
      - "config/watchlist.json"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

# 需要寫入權限才能把新資料 commit 回儲存庫
permissions:
  contents: write

# 避免兩次更新同時執行互相衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 49 檔＋重試；最壞情況（全部失敗都重試兩輪）約 25 分鐘
    timeout-minutes: 45
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      # 資料放在 data 分支（main 只放程式碼，儲存庫才不會每天變大）。
      # 先把現有資料拿回 public/data：某一檔今天抓失敗時，才能沿用它前一天的檔案。
      - name: 取回目前的資料（data 分支）
        run: |
          mkdir -p public/data
          if git fetch --depth 1 origin data; then
            git archive FETCH_HEAD | tar -x -C public/data
            echo "已取回 $(ls public/data | wc -l) 個資料檔"
          else
            echo "還沒有 data 分支，從頭開始"
          fi

      # 備援排程：如果「美股這次收盤之後」已經成功更新過（每一檔都成功、最新一天都有收盤價），第二次排程就不用再跑。
      # 判斷基準是最近一次 UTC 22:00（台灣 06:00，美股已收盤）：之後更新的資料才算今天的收盤資料。
      # （不能只看「幾小時內更新過」：收盤前推程式碼觸發的更新，抓到的還是前一天的資料）
      # 只對「排程」觸發的執行生效；手動執行和推程式碼觸發的一律照跑。
      - name: 檢查今天是否已經更新過
        id: fresh
        run: |
          skip=false
          # 排程（GitHub schedule 或 Vercel Cron 觸發的 source=cron）才檢查；手動執行一律照跑
          scheduled=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.source }}" = "cron" ]; then scheduled=true; fi
          if [ "$scheduled" = "true" ] && git rev-parse -q --verify FETCH_HEAD >/dev/null; then
            now=$(date -u +%s)
            boundary=$(date -u -d "$(date -u +%F) 22:00" +%s)
            [ "$now" -lt "$boundary" ] && boundary=$((boundary - 86400))
            updated=$(git log -1 --format=%ct FETCH_HEAD)
            # 失敗的檔數＋「最新一天收盤價是空的」檔數；有任何一檔就重抓
            failed=$(python3 -c "import json;s=json.load(open('public/data/status.json'))['summary'];print(len(s['failed'])+len(s.get('incomplete',[])))" 2>/dev/null || echo 999)
            echo "資料更新於 $(date -u -d @"$updated" '+%F %H:%M') UTC；基準 $(date -u -d @"$boundary" '+%F %H:%M') UTC；上次失敗 ${failed} 檔"
            if [ "$updated" -ge "$boundary" ] && [ "$failed" = "0" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then echo "今天已經成功更新過，這次排程略過（不重抓、不重新部署、不重送通知）"; fi

      - name: 安裝 Python
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安裝套件
        if: steps.fresh.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: 檢查指標計算
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/test_indicators.py

      - name: 抓取資料並計算指標
        if: steps.fresh.outputs.skip != 'true'
        # 個別股票失敗會保留舊檔；全部失敗才會讓這一步變紅色（後面的步驟就不會執行）
        env:
          # Yahoo 漏掉美股最新一天時，用 Finnhub 的收盤價補上（沒設定就不補）
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_data.py

      # ---- ML 實驗室：波動度預測、漲跌方向實驗（寫 public/data/ml.json）----
      # 先跑自我檢查（含「沒有偷看未來」的測試）再訓練；失敗時保留上一次的 ml.json，不影響後面的步驟
      - name: ML 實驗室（波動度預測、漲跌方向實驗）
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/test_ml.py && python scripts/ml_lab.py

      # ---- 每日篩選通知（Discord）----
      # 用網站篩選器同一套程式判斷（scripts/notify.ts），所以需要 Node。
      # 沒有設定 DISCORD_WEBHOOK_URL 就只在記錄裡印出結果；通知失敗不影響資料發布。
      - name: 安裝 Node（篩選通知用）
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22   # 和 ci.yml 相同
          cache: npm

      - name: 安裝前端套件（篩選通知用）
        if: steps.fresh.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: 送出每日篩選通知
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 新聞與財報提醒（沒設定時略過這幾張卡片，其他通知照常）
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # 在 Actions 頁面手動執行時強制送出（自動排程與推程式碼觸發的，同一天只送一次）
          # （Vercel Cron 觸發的 source=cron 當作排程，不強制）
          NOTIFY_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source != 'cron' && '1' || '0' }}
        run: npx vite-node scripts/notify.ts

      - name: 發布資料到 data 分支（只保留最新一份）
        if: steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public/data
          # 告訴 Vercel 不要部署 data 分支（只有 main 會部署；這個檔不會出現在網站上）
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 強制覆蓋：data 分支永遠只有一個 commit，舊資料不會累積
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:data

      - name: 通知 Vercel 重新部署（更新 main 上的資料版本檔）
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只改一個很小的檔案，main 才不會因為資料而變大；Vercel 偵測到 main 有新 commit 就會重建
          date -u +%Y-%m-%dT%H:%M:%SZ > .data-version
          git add .data-version
          git commit -q -m "chore(data): 資料已更新 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
