# 每日自動更新股價資料
# 台灣時間每天早上 6:00（= UTC 22:00）執行，也可以在 Actions 頁面手動觸發
name: 更新股價資料

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}        # 允許手動觸發（Actions → 更新股價資料 → Run workflow）
  # 修改觀察清單或資料腳本並推到 main 時，也自動重抓一次
  # （Actions 自己 commit 的 public/data 不在清單內，不會無限循環）
  push:
    branches: [main]
    paths:
      - "config/watchlist.json"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

# 需要寫入權限才能把新資料 commit 回儲存庫
permissions:
  contents: write

# 避免兩次更新同時執行互相衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 49 檔＋重試；最壞情況（全部失敗都重試兩輪）約 25 分鐘
    timeout-minutes: 45
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 檢查指標計算
        run: python scripts/test_indicators.py

      - name: 抓取資料並計算指標
        # 個別股票失敗會保留舊檔；全部失敗才會讓這一步變紅色
        run: python scripts/fetch_data.py

      - name: 有變更才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要 commit"
          else
            git commit -m "chore(data): 每日資料更新 $(date -u +%Y-%m-%d)"
            git push
          fi
