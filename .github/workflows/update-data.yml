# 每日自動更新股價資料
# 台灣時間每天早上 6:00（= UTC 22:00）執行，也可以在 Actions 頁面手動觸發
name: 更新股價資料

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}        # 允許手動觸發（Actions → 更新股價資料 → Run workflow）
  # 修改觀察清單或資料腳本並推到 main 時，也自動重抓一次
  # （Actions 自己 commit 的 public/data 不在清單內，不會無限循環）
  push:
    branches: [main]
    paths:
      - "config/watchlist.json"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

# 需要寫入權限才能把新資料 commit 回儲存庫
permissions:
  contents: write

# 避免兩次更新同時執行互相衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 49 檔＋重試；最壞情況（全部失敗都重試兩輪）約 25 分鐘
    timeout-minutes: 45
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      # 資料放在 data 分支（main 只放程式碼，儲存庫才不會每天變大）。
      # 先把現有資料拿回 public/data：某一檔今天抓失敗時，才能沿用它前一天的檔案。
      - name: 取回目前的資料（data 分支）
        run: |
          mkdir -p public/data
          if git fetch --depth 1 origin data; then
            git archive FETCH_HEAD | tar -x -C public/data
            echo "已取回 $(ls public/data | wc -l) 個資料檔"
          else
            echo "還沒有 data 分支，從頭開始"
          fi

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 檢查指標計算
        run: python scripts/test_indicators.py

      - name: 抓取資料並計算指標
        # 個別股票失敗會保留舊檔；全部失敗才會讓這一步變紅色（後面的步驟就不會執行）
        run: python scripts/fetch_data.py

      # ---- 每日篩選通知（Discord）----
      # 用網站篩選器同一套程式判斷（scripts/notify.ts），所以需要 Node。
      # 沒有設定 DISCORD_WEBHOOK_URL 就只在記錄裡印出結果；通知失敗不影響資料發布。
      - name: 安裝 Node（篩選通知用）
        uses: actions/setup-node@v4
        with:
          node-version: 22   # 和 ci.yml 相同
          cache: npm

      - name: 安裝前端套件（篩選通知用）
        run: npm ci --no-audit --no-fund

      - name: 送出每日篩選通知
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx vite-node scripts/notify.ts

      - name: 發布資料到 data 分支（只保留最新一份）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public/data
          # 告訴 Vercel 不要部署 data 分支（只有 main 會部署；這個檔不會出現在網站上）
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 強制覆蓋：data 分支永遠只有一個 commit，舊資料不會累積
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:data

      - name: 通知 Vercel 重新部署（更新 main 上的資料版本檔）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只改一個很小的檔案，main 才不會因為資料而變大；Vercel 偵測到 main 有新 commit 就會重建
          date -u +%Y-%m-%dT%H:%M:%SZ > .data-version
          git add .data-version
          git commit -q -m "chore(data): 資料已更新 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
