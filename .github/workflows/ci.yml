# 每次推送或開 Pull Request 時，自動檢查程式能不能正常建置、測試有沒有通過
name: 檢查程式

on:
  push:
    branches: [main]
    # 每日資料更新只改 .data-version；每日 AI 報告只改 public/ai/（由「檢查 AI 報告」另外檢查），都不需要重跑整套測試
    paths-ignore: [".data-version", "public/ai/**"]
  pull_request:

jobs:
  check:
    name: 單元測試與建置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下載資料（data 分支）
        run: bash scripts/pull-data.sh
      - name: 前端單元測試
        run: npm test
      - name: 檢查 AI 報告（格式、禁用詞、只提到觀察清單）
        run: npm run check:report
      - name: 建置
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 指標測試
        run: |
          pip install pandas numpy "scikit-learn>=1.5"
          python scripts/test_indicators.py
          python scripts/test_ml.py

  e2e:
    name: 瀏覽器端對端測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下載資料（data 分支）
        run: bash scripts/pull-data.sh
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: 建置
        run: npm run build
      - name: 執行 E2E 測試（桌機＋手機）
        run: npm run test:e2e
      - name: 失敗時上傳測試報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
