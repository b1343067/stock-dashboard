# 每次推送或開 Pull Request 時，自動檢查程式能不能正常建置、測試有沒有通過
name: 檢查程式

on:
  push:
    branches: [main]
    paths-ignore: [".data-version"]   # 每日資料更新只改這個檔，不需要重跑檢查
  pull_request:

jobs:
  check:
    name: 單元測試與建置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下載資料（data 分支）
        run: bash scripts/pull-data.sh
      - name: 前端單元測試
        run: npm test
      - name: 建置
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 指標測試
        run: |
          pip install pandas numpy
          python scripts/test_indicators.py

  e2e:
    name: 瀏覽器端對端測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下載資料（data 分支）
        run: bash scripts/pull-data.sh
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: 建置
        run: npm run build
      - name: 執行 E2E 測試（桌機＋手機）
        run: npm run test:e2e
      - name: 失敗時上傳測試報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
